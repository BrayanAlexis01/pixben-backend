name: UX and variant validation

on:
  push:
    branches: [ "ux-wholesale-dtf-20260925" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile backend
        run: mvn -B -DskipTests package
      - name: Test cart variants
        run: mvn -B -Dtest=CarritoControllerVariantTest test

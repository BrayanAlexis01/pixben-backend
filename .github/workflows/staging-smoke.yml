name: Staging API smoke test (isolated H2 + Mongo)

on:
  push:
    branches: ["fix/performance-concurrency-20261010", "fix/catalog-cache-render-starter-20261011"]
    paths:
      - ".github/workflows/staging-smoke.yml"
      - "src/main/**"
      - "src/test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build application
        run: mvn -B -DskipTests package
      - name: Start isolated Spring Boot
        env:
          PORT: "8080"
          SPRING_DATASOURCE_URL: "jdbc:h2:mem:pixbenstage;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_DATA_MONGODB_URI: "mongodb://127.0.0.1:27017/pixben_stage_ci"
        run: |
          nohup java -Xmx320m -XX:ActiveProcessorCount=1 -jar target/pixben-0.0.1-SNAPSHOT.jar > /tmp/pixben-stage.log 2>&1 &
          echo $! > /tmp/pixben-stage.pid
          python3 - <<'PY'
          import time,urllib.request
          for i in range(80):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/api/health", timeout=2) as r:
                      if r.status == 200:
                          print("STAGING_READY", flush=True)
                          break
              except Exception:
                  time.sleep(2)
          else:
              print(open("/tmp/pixben-stage.log").read()[-12000:])
              raise SystemExit("Spring Boot failed to start")
          PY
      - name: Verify catalog and Mongo APIs
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from urllib.error import HTTPError
          base="http://127.0.0.1:8080"
          for path in ["/api/health","/productos/pagina?pagina=0&limite=16","/productos/filtros","/productos/destacados","/productos/por-ids?ids=1"]:
              with urllib.request.urlopen(base+path,timeout=10) as r:
                  obj=json.loads(r.read())
                  assert r.status == 200,(path,r.status)
                  if "/pagina" in path:
                      assert "content" in obj and "totalElements" in obj,obj
                  print("SMOKE_OK",path,r.status,flush=True)
          request=urllib.request.Request(base+"/visitas",data=json.dumps({"visitanteId":"staging-ci-test","ruta":"/productos"}).encode(),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(request,timeout=10) as r:
              assert r.status == 200, r.status
              print("SMOKE_OK POST /visitas (test Mongo only)",flush=True)
          PY
      - name: Dump startup logs on failure
        if: failure()
        run: tail -150 /tmp/pixben-stage.log || true

name: Bounded production read-only load test

on:
  push:
    branches: ["fix/performance-concurrency-20261010", "master"]
    paths:
      - "performance/safe_live_load.py"
      - ".github/workflows/safe-load-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP testing dependency
        run: python -m pip install "aiohttp>=3.10,<4"
      - name: Run gradual 100/300/500-user load test (GET only)
        env:
          PIXBEN_API_BASE: https://pixben-backend.onrender.com
          STAGES: "100,300,500"
          STAGE_SECONDS: "20"
        run: python performance/safe_live_load.py

name: Performance branch validation

on:
  push:
    branches: [ "perf-optimization-20260925" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile backend
        run: mvn -B -DskipTests package
      - name: Bounded production read load test
        env:
          PIXBEN_API_BASE: https://pixben-backend.onrender.com
          LOAD_ROUNDS: "3"
        run: python3 performance/http_load_test.py
